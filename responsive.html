<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="responsive.css " />
    <title>Navbar</title>
  </head>
  <body>
    <header>
      <div class="header-content">
        <div class="logo">
          <img
            src="https://www.gstatic.com/images/branding/searchlogo/ico/favicon.ico"
            alt="https://www.gstatic.com/images/branding/searchlogo/ico/favicon.ico"
            class="brand-logo"
          /><span class="brand-name">Rebound</span>
        </div>
        <nav class="nav-desktop">
          <ul>
            <li>
              <a href="#home">Home</a>
            </li>
            <li>
              <a href="#about">About</a>
            </li>
            <li>
              <a href="#company">Company</a>
            </li>
            <li>
              <a href="#contact">Contact</a>
            </li>
          </ul>
        </nav>

        <div class="right-side">
          <button
            class="navbar-toggle"
            aria-expanded="false"
            aria-controls="nav-menu"
            aria-label="Toggle menu"
          >
            ☰
          </button>
          <div class="cta">
            <button>Get Yours</button>
          </div>
        </div>

         <nav id="nav-menu" class="navbar-menu">
      <ul class="navbar-links">
            <li>
              <a href="#home">Home</a>
            </li>
            <li>
              <a href="#about">About</a>
            </li>
            <li>
              <a href="#company">Company</a>
            </li>
            <li>
              <a href="#contact">Contact</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <script type="module" src="./responsive.js"></script>
  </body>
</html>
